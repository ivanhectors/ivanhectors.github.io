<footer class="footer">
  <div class="footer__copyright">
    <div class="bottom">
      <span class="footer__copyright-line intro__contact">
        <svg class="footer__copyright-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M15.5 9a4.5 4.5 0 1 0 0 6"></path>
        </svg>
        <span>2026 <a href="{{site.baseurl}}" target="_blank" rel="noopener noreferrer" class="highlight-link">Ivan Hectors</a></span>
      </span>
      <img class="emoji" src="{{site.baseurl}}/img/emojis/rockon.png" alt="emoji">
    </div>
  </div>
  <div class="footer__links">
    {% for link in site.social %}
    <a href="{{link.url}}" target="_blank" title="{{link.title}}">
      <span class="text">{{link.title}}</span>
      <img src="{{site.baseurl}}/img/social/{{link.title}}.svg" alt="{{link.title}}">
    </a>
    {% endfor %}
  </div>
</footer>
